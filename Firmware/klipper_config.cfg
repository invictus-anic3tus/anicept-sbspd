# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Klipper config snippet — paste_dispenser
#
# Add this to your printer.cfg (or an [include paste_dispenser.cfg])
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

# Shell command that calls the dispenser Python script.
# Adjust the path to wherever you cloned/copied the project.
[gcode_shell_command dispense]
command: python3 /home/pi/paste_dispenser/dispenser.py
timeout: 30
verbose: True

# Optional: a convenience macro so you can test from the Klipper console
[gcode_macro PASTE_PRIME]
description: Prime the paste extruder
gcode:
    RUN_SHELL_COMMAND CMD=dispense PARAMS="prime 3.0 200"

[gcode_macro PASTE_RETRACT]
description: Retract paste (anti-drool)
gcode:
    RUN_SHELL_COMMAND CMD=dispense PARAMS="retract 0.15 300"

[gcode_macro PASTE_DERETRACT]
description: Deretract paste before dispensing
gcode:
    RUN_SHELL_COMMAND CMD=dispense PARAMS="deretract 0.15 300"

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Usage notes
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
#
# 1. Enable gcode_shell_command in moonraker.conf if not already:
#       [update_manager klipper-extra-scripts]
#       ...
#    (Most Mainsail/Fluidd installs include this via KIAUH)
#
# 2. Make dispenser.py executable:
#       chmod +x /home/pi/paste_dispenser/dispenser.py
#
# 3. Test from Klipper console:
#       RUN_SHELL_COMMAND CMD=dispense PARAMS="dispense 2.0 300"
#
# 4. The generated .gcode file uses relative positioning (G91) throughout.
#    Before running it:
#       a. G28  (home all axes)
#       b. Attach paste extruder toolhead manually
#       c. Use the tip along a PCB straight edge (or trace, silkscreen line, etc.) to ensure the PCB is not skewed
#       d. Jog tip to the priming test point on the PCB
#       e. Start the .gcode file — do NOT re-home after step (c)
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
